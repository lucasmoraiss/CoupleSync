# Segunda conta entra no grupo da primeira pelo código de convite (lido da tela, nunca fixo).
# Como são duas contas no mesmo grupo, é também aqui que se vê a análise com IA entre duas pessoas: ela já vem
# ligada para o grupo, ninguém é perguntado nem avisado ao criar ou ao entrar; em Configurações > Inteligência
# artificial a segunda conta desliga para o grupo, vê o Assistente dizer que está desligada, e liga de novo direto.
appId: com.couplesync.app
name: 03 - Entrar em grupo
---
- evalScript: ${output.emailA = 'e2e-03a-' + Date.now() + '@example.com'}
- evalScript: ${output.emailB = 'e2e-03b-' + Date.now() + '@example.com'}

# Primeira conta: cria o grupo; o código de convite é copiado da tela.
- launchApp:
    clearState: true
- runFlow:
    file: comum/criar-conta.yaml
    env:
      NOME: Caio Teste
      EMAIL: ${output.emailA}
- runFlow: comum/criar-grupo.yaml
- copyTextFrom:
    text: "[A-Z0-9]{8}"
- evalScript: ${output.codigo = maestro.copiedText}
- assertTrue: ${output.codigo.length == 8}

# A primeira conta chega direto ao Painel, com a IA já ligada: sem pergunta, com o Assistente no cabeçalho.
- tapOn: "Ir para o Painel"
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 60000
- extendedWaitUntil:
    visible: "Abrir o Assistente"
    timeout: 30000
- assertNotVisible: "Quer que a IA analise as finanças do grupo\\?"

# Segunda conta, como num outro aparelho: o app é aberto do zero.
- launchApp:
    clearState: true
- runFlow:
    file: comum/criar-conta.yaml
    env:
      NOME: Davi Teste
      EMAIL: ${output.emailB}
- tapOn: "Entrar em um grupo com código de convite"
- extendedWaitUntil:
    visible: "Entrar no grupo"
    timeout: 15000
- tapOn: "Código de convite do grupo"
- inputText: ${output.codigo}
- hideKeyboard
- tapOn: "Confirmar entrada no grupo"

# Quem entra num grupo também chega direto ao Painel: não é perguntado nem avisado de nada sobre a IA, que já
# está ligada para o grupo (o Assistente está no Painel e não há cartão de ativar).
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 60000
- extendedWaitUntil:
    visible: "Abrir o Assistente"
    timeout: 30000
- assertNotVisible: "Quer que a IA analise as finanças do grupo\\?"
- assertNotVisible: "Análise com IA desligada.*"

# Configurações > Inteligência artificial: o estado é "Ligada", sem ninguém ter ativado nada; não há aceite a
# retirar nem o que ligar.
- tapOn: "Configurações"
- extendedWaitUntil:
    visible: "Abrir o grupo: membros e código de convite"
    timeout: 30000
- scrollUntilVisible:
    element: "Abrir a inteligência artificial: ligar ou desligar e ver o consumo"
    direction: DOWN
    timeout: 20000
- tapOn: "Abrir a inteligência artificial: ligar ou desligar e ver o consumo"
- extendedWaitUntil:
    visible: "Ligada"
    timeout: 30000
- assertNotVisible: "Ligar de novo a análise com IA para o grupo"
- assertNotVisible: "Retirar o meu aceite da análise com IA"

# Qualquer membro desliga para o grupo (com confirmação).
- tapOn: "Desligar a análise com IA para o grupo"
- extendedWaitUntil:
    visible: "Desligar para o grupo\\?"
    timeout: 15000
- tapOn: "Desligar"
- extendedWaitUntil:
    visible: "Desligada para o grupo"
    timeout: 30000
- assertNotVisible: "Desligar a análise com IA para o grupo"
- assertVisible: "Ligar de novo a análise com IA para o grupo"

# Com a IA desligada para o grupo, o Assistente continua no Painel e diz que está desligada, com o caminho de
# volta para Configurações > Inteligência artificial.
- tapOn: "Painel"
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 30000
- tapOn: "Abrir o Assistente"
- extendedWaitUntil:
    visible: "A IA está desligada para este grupo"
    timeout: 30000
- assertNotVisible: "Pergunta para o Assistente"
- tapOn: "Abrir as configurações de inteligência artificial para ligar de novo"

# Ligar de novo é direto: um toque, sem texto a aceitar nem tela de pergunta.
- extendedWaitUntil:
    visible: "Desligada para o grupo"
    timeout: 30000
- tapOn: "Ligar de novo a análise com IA para o grupo"
- extendedWaitUntil:
    visible: "Ligada"
    timeout: 30000
- assertNotVisible: "Quer que a IA analise as finanças do grupo\\?"
- assertVisible: "Desligar a análise com IA para o grupo"
- assertNotVisible: "Tentar novamente"
- tapOn: "Voltar para as configurações"

# Issue #3: a versão do APK instalado é lida do módulo nativo de verdade (este é um APK real). A linha fica no fim
# de Configurações, depois de "Sair da conta", e não depende do GitHub. Por expressão regular: vale para 1.2.0.
- scrollUntilVisible:
    element: "Versão do app: [0-9]+\\.[0-9]+\\.[0-9]+"
    direction: DOWN
    timeout: 30000

# O grupo em que entrou é o da primeira conta: mesmo código, os dois membros.
- scrollUntilVisible:
    element: "Abrir o grupo: membros e código de convite"
    direction: UP
    timeout: 30000
- tapOn: "Abrir o grupo: membros e código de convite"
- extendedWaitUntil:
    visible: "Membros"
    timeout: 30000
- assertVisible: ${output.codigo}
- assertVisible: "Caio Teste"
- assertVisible: "Davi Teste \\(você\\)"
- assertNotVisible: "Tentar novamente"

# De volta ao Painel: com a IA ligada de novo, o Assistente está lá e abre na conversa.
- tapOn: "Painel"
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 30000
- assertNotVisible: "Análise com IA desligada.*"
- tapOn: "Abrir o Assistente"
- extendedWaitUntil:
    visible: "Pergunta para o Assistente"
    timeout: 30000
