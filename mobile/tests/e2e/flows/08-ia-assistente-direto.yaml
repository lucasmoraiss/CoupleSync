# A análise com IA vem ligada para o grupo: no primeiro uso não há pergunta nem tela de ativar, e o Assistente
# abre direto pelo Painel. (Desligar para o grupo e ligar de novo, com duas contas, é o fluxo 03.)
# A API de teste roda com o provedor falso de IA (Ai__UseFakeProvider=true em scripts/app-e2e-api.sh): nenhuma
# chave, nenhuma chamada a provedor de verdade, e a resposta do Assistente é sempre a mesma frase.
appId: com.couplesync.app
name: 08 - IA - Assistente direto
---
- evalScript: ${output.email = 'e2e-08-' + Date.now() + '@example.com'}
- launchApp:
    clearState: true
- runFlow:
    file: comum/criar-conta.yaml
    env:
      NOME: Iara Teste
      EMAIL: ${output.email}
- runFlow: comum/criar-grupo.yaml
- tapOn: "Ir para o Painel"

# Primeiro uso do grupo: direto no Painel, com o botão do Assistente no cabeçalho. Nenhuma pergunta sobre a IA,
# nenhum cartão de ativar.
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 60000
- extendedWaitUntil:
    visible: "Abrir o Assistente"
    timeout: 30000
- assertNotVisible: "Quer que a IA analise as finanças do grupo\\?"
- assertNotVisible: "Análise com IA desligada.*"
- tapOn: "Abrir o Assistente"

# O Assistente abre na conversa, sem pedir para ativar nada, e responde (pelo provedor falso).
- extendedWaitUntil:
    visible: "Pergunta para o Assistente"
    timeout: 30000
- assertNotVisible: "A IA está desligada para este grupo"
- tapOn: "Pergunta para o Assistente"
- inputText: "Quanto gastamos este mes"
- tapOn: "Enviar mensagem"
- extendedWaitUntil:
    visible: ".*Esta é uma resposta de teste do assistente, sem dados reais..*"
    timeout: 60000
- assertNotVisible: "Tentar novamente"
- assertNotVisible: "Algo deu errado"

# De volta ao Painel pelo botão da tela.
- tapOn: "Voltar para o Painel"
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 30000
