# Criar conta, criar grupo, ver o código de convite e chegar ao Painel.
appId: com.couplesync.app
name: 01 - Cadastro e grupo
---
- evalScript: ${output.email = 'e2e-01-' + Date.now() + '@example.com'}
- launchApp:
    clearState: true
- runFlow:
    file: comum/criar-conta.yaml
    env:
      NOME: Ana Teste
      EMAIL: ${output.email}
- runFlow: comum/criar-grupo.yaml

# O código de convite: 8 caracteres, e o botão de copiar.
- copyTextFrom:
    text: "[A-Z0-9]{8}"
- assertTrue: ${maestro.copiedText.length == 8}
- assertVisible: "Copiar código do grupo"

- tapOn: "Ir para o Painel"
# No primeiro uso do grupo o app pergunta pela análise com IA antes do Painel.
- runFlow: comum/responder-agora-nao-a-ia.yaml
- extendedWaitUntil:
    visible: "Total de gastos"
    timeout: 60000
- assertVisible: "0 transações"
# O atalho fica no fim do Painel; com o aviso do e-mail e o cartão da análise com IA acima, pode estar abaixo da dobra.
- scrollUntilVisible:
    element: "Ver todas as transações"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Tentar novamente"
