name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: couplesync_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "Host=localhost;Port=5432;Database=couplesync_test;Username=postgres;Password=postgres"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/CoupleSync.sln

      - name: Build
        run: dotnet build backend/CoupleSync.sln --no-restore --configuration Release

      - name: Apply migrations
        run: |
          dotnet tool install -g dotnet-ef
          cd backend
          dotnet ef database update -p src/CoupleSync.Infrastructure/CoupleSync.Infrastructure.csproj -s src/CoupleSync.Api/CoupleSync.Api.csproj

      - name: Test — Unit
        run: >
          dotnet test backend/tests/CoupleSync.UnitTests/CoupleSync.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/tests/CoupleSync.UnitTests/TestResults/*.trx

      # Runs with globalization-invariant mode on (no ICU), as in a minimal container.
      - name: Test — Invariant globalization
        run: >
          dotnet test backend/tests/CoupleSync.InvariantGlobalizationTests/CoupleSync.InvariantGlobalizationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=invariant-results.trx"

      - name: Test — Integration
        run: >
          dotnet test backend/tests/CoupleSync.IntegrationTests/CoupleSync.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-results.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/tests/CoupleSync.IntegrationTests/TestResults/*.trx

      - name: Test — E2E
        run: >
          dotnet test backend/tests/CoupleSync.E2ETests/CoupleSync.E2ETests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=e2e-results.trx"

      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: backend/tests/CoupleSync.E2ETests/TestResults/*.trx

      # Starts its own PostgreSQL container (Testcontainers; ubuntu runners have Docker) and ignores DATABASE_URL.
      # COUPLESYNC_REQUIRE_POSTGRES_TESTS=1 turns a missing Docker into a failure instead of a skip.
      - name: Test — PostgreSQL (Testcontainers)
        env:
          COUPLESYNC_REQUIRE_POSTGRES_TESTS: "1"
        run: >
          dotnet test backend/tests/CoupleSync.PostgresTests/CoupleSync.PostgresTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=postgres-results.trx"

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: backend/tests/CoupleSync.PostgresTests/TestResults/*.trx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile — install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
        continue-on-error: true   # informational only — don't fail PRs yet

      - name: Mobile type-check
        working-directory: mobile
        run: npx tsc --noEmit

      # Unit tests of the app's pure logic (ts-jest, node environment — see mobile/jest.config.js).
      - name: Mobile tests
        working-directory: mobile
        run: npm test -- --ci

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # The image is what gets deployed, and it can fail where every test above passes (it once shipped without
      # ICU and the API did not start). Build it and run it for real against a throwaway PostgreSQL container:
      # health endpoints, sign-up, group, transactions with accented categories, a validation error in Portuguese.
      - name: Docker image — build
        run: docker build --file backend/Dockerfile --tag couplesync-api:ci-check backend/

      - name: Docker image — smoke test
        run: bash scripts/api-image-smoke-test.sh couplesync-api:ci-check

      # Same image with culture data switched off: the code must not depend on the host having ICU.
      - name: Docker image — smoke test without culture data
        env:
          SMOKE_FORCE_INVARIANT: "1"
        run: bash scripts/api-image-smoke-test.sh couplesync-api:ci-check
