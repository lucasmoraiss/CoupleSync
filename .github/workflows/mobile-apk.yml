name: Mobile APK — Build & Publish

# Runs on version-tag pushes (v*) and on manual dispatch. The backend is deployed
# by the hosting platform (Render) straight from the repository, so there is no
# deploy workflow to wait for.
#
# Every run uploads the APK as a workflow artifact. A run for a v* tag also
# publishes it on the GitHub Release of that tag under the FIXED name
# `couplesync.apk`, so this link always downloads the newest build:
#   https://github.com/lucasmoraiss/CoupleSync/releases/latest/download/couplesync.apk
# A manual dispatch from a branch builds and uploads the artifact only.
#
# Required secret: EXPO_TOKEN
#   expo.dev → Settings → Access Tokens → Create token

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build-apk:
    name: EAS Build — Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release tag must point at a commit that is already in main: nothing else is reviewed.
      - name: Check that a tag build is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not in main. No APK was built."
            exit 1
          fi

      # The app compares its installed versionName (expo.version) with the newest Release tag, so the tag has to be
      # exactly v<expo.version> of this commit. Checked before anything that costs a build.
      - name: Check that the tag matches expo.version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bash scripts/check-tag-version.sh "${TAG_NAME}" mobile/app.json

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli@12

      # EXPO_TOKEN authenticates the EAS CLI against the Expo account.
      # EXPO_PUBLIC_API_BASE_URL is baked into the APK via eas.json
      # production.env at EAS cloud build time — not injected from the runner.
      - name: EAS Build — Android APK (production)
        id: eas-build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --json)
          BUILD_ID=$(echo "${BUILD_OUTPUT}" | jq -r '.[0].id // .id // empty')
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::Could not parse build ID from EAS build output."
            exit 1
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      # Retrieve the download URL using the exact build ID to avoid race conditions
      - name: Retrieve APK download URL from EAS
        id: get-apk
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.eas-build.outputs.build_id }}
        run: |
          APK_URL=$(eas build:view \
            "${BUILD_ID}" \
            --json \
            | jq -r '.artifacts.buildUrl')

          if [ -z "${APK_URL}" ] || [ "${APK_URL}" = "null" ]; then
            echo "::error::Could not retrieve APK URL from EAS build."
            exit 1
          fi

          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"

      # Step outputs reach the script through the environment, never interpolated into it.
      - name: Download APK
        env:
          APK_URL: ${{ steps.get-apk.outputs.apk_url }}
        run: curl -fsSL --proto '=https' -o couplesync.apk "${APK_URL}"

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: couplesync-production-apk
          path: couplesync.apk
          if-no-files-found: error
          retention-days: 30

  # Only for v* tags: a manual dispatch from a branch stops at the artifact above.
  publish-release:
    name: GitHub Release — couplesync.apk
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: couplesync-production-apk

      # Creates the Release on the first run for a tag; a re-run replaces the asset (same fixed name).
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists: replacing the asset."
            gh release upload "${TAG}" couplesync.apk --clobber
          else
            # Created together with the asset, so the fixed "latest" link never points at an empty Release.
            gh release create "${TAG}" couplesync.apk \
              --verify-tag \
              --latest \
              --title "CoupleSync ${TAG}" \
              --notes "APK Android do CoupleSync ${TAG}. Baixe o arquivo couplesync.apk abaixo e instale por cima do app atual."
          fi

          {
            echo "## APK publicado"
            echo ""
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- Link fixo (sempre o mais novo): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/couplesync.apk"
          } >> "${GITHUB_STEP_SUMMARY}"
