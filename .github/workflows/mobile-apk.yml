name: Mobile APK — Build & Publish

# Runs on version-tag pushes (v*) and on manual dispatch. The backend is deployed
# by the hosting platform (Render) straight from the repository, so there is no
# deploy workflow to wait for.
#
# Every run uploads the APK as a workflow artifact. A run for a v* tag also
# publishes it on the GitHub Release of that tag under the FIXED name
# `couplesync.apk`, so this link always downloads the newest build:
#   https://github.com/lucasmoraiss/CoupleSync/releases/latest/download/couplesync.apk
# A manual dispatch from a branch builds and uploads the artifact only.
#
# Required secret: EXPO_TOKEN
#   expo.dev → Settings → Access Tokens → Create token

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build-apk:
    name: EAS Build — Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release tag must point at a commit that is already in main: nothing else is reviewed.
      - name: Check that a tag build is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not in main. No APK was built."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # The app compares its installed versionName (expo.version) with the newest Release tag, so the tag has to be
      # exactly v<expo.version> of this commit. Runs right after Node is set up (the script needs node), before npm ci and anything that costs a build.
      - name: Check that the tag matches expo.version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bash scripts/check-tag-version.sh "${TAG_NAME}" mobile/app.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli@12

      # EXPO_TOKEN authenticates the EAS CLI against the Expo account.
      # EXPO_PUBLIC_API_BASE_URL is baked into the APK via eas.json
      # production.env at EAS cloud build time — not injected from the runner.
      - name: EAS Build — Android APK (production)
        id: eas-build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --json)
          BUILD_ID=$(echo "${BUILD_OUTPUT}" | jq -r '.[0].id // .id // empty')
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::Could not parse build ID from EAS build output."
            exit 1
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      # Retrieve the download URL using the exact build ID to avoid race conditions. In a tag build the same answer
      # also says which version the APK declares: it has to be the tag, checked before anything is downloaded or published.
      - name: Retrieve APK download URL from EAS
        id: get-apk
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.eas-build.outputs.build_id }}
          REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          eas build:view "${BUILD_ID}" --json > "${RUNNER_TEMP}/eas-build.json"

          case "${REF}" in
            refs/tags/v*) bash "${GITHUB_WORKSPACE}/scripts/check-built-apk-version.sh" "${TAG_NAME}" "${RUNNER_TEMP}/eas-build.json" ;;
          esac

          APK_URL=$(jq -r '.artifacts.buildUrl' "${RUNNER_TEMP}/eas-build.json")

          if [ -z "${APK_URL}" ] || [ "${APK_URL}" = "null" ]; then
            echo "::error::Could not retrieve APK URL from EAS build."
            exit 1
          fi

          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"

      # Step outputs reach the script through the environment, never interpolated into it.
      - name: Download APK
        env:
          APK_URL: ${{ steps.get-apk.outputs.apk_url }}
        run: curl -fsSL --proto '=https' -o couplesync.apk "${APK_URL}"

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: couplesync-production-apk
          path: couplesync.apk
          if-no-files-found: error
          retention-days: 30

  # Only for v* tags: a manual dispatch from a branch stops at the artifact above.
  publish-release:
    name: GitHub Release — couplesync.apk
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Before the download: checkout cleans the workspace. The scripts come from the tag's own commit (already checked to be in main).
      - name: Checkout (scripts)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: couplesync-production-apk

      # What to do depends on the Release of this tag (scripts/release-action.sh):
      #   criar     -> does not exist: created together with the asset, as the latest.
      #   nada      -> published with couplesync.apk uploaded: untouched (a re-run must not take the fixed link down).
      #   completar -> the first run of this tag died halfway (draft, or no file): sends what is missing and publishes it
      #                as the latest, the same end state as a first run that succeeds (--draft=false --latest).
      # In every path the step then READS from GitHub which Release is the latest and writes that fact in the summary.
      # criar/completar fail if it is not this tag (or cannot be read); nada only reports it, because the owner may
      # have chosen another Release as the latest on purpose.
      - name: Create or complete the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VIEW="${RUNNER_TEMP}/release-view.json"
          ERR="${RUNNER_TEMP}/release-view.err"
          : > "${VIEW}"
          if ! gh release view "${TAG}" --json isDraft,assets > "${VIEW}" 2> "${ERR}"; then
            : > "${VIEW}"
            if ! grep -qi "release not found" "${ERR}"; then
              cat "${ERR}"
              echo "::error::Could not read the Release ${TAG}. Nothing was changed."
              exit 1
            fi
            # `gh release view <tag>` also finds a draft, so "not found" means there is no Release for the tag. If one
            # exists anyway, `gh release create` below fails closed because the Release already exists.
          fi

          ACTION=$(bash scripts/release-action.sh "${VIEW}")
          NEEDS_FILE=$(bash scripts/release-action.sh "${VIEW}" --arquivo)

          case "${ACTION}" in
            criar)
              # Created together with the asset, so the fixed "latest" link never points at an empty Release.
              gh release create "${TAG}" couplesync.apk \
                --verify-tag \
                --latest \
                --title "CoupleSync ${TAG}" \
                --notes "APK Android do CoupleSync ${TAG}. Baixe o arquivo couplesync.apk abaixo e instale por cima do app atual."
              RESULT="Release criada com o arquivo."
              ;;
            nada)
              RESULT="A Release ja estava publicada com couplesync.apk: nada foi alterado."
              ;;
            completar)
              if [ "${NEEDS_FILE}" = "sim" ]; then
                gh release upload "${TAG}" couplesync.apk --clobber
              fi
              gh release edit "${TAG}" --draft=false --latest
              RESULT="Release que estava incompleta foi completada e publicada como a mais recente."
              ;;
            *)
              echo "::error::Unexpected decision '${ACTION}'."
              exit 1
              ;;
          esac

          # What GitHub says is the latest Release now (read, not assumed).
          LATEST_OK=1
          LATEST=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name) || LATEST_OK=0
          if [ "${LATEST_OK}" = "1" ]; then
            LATEST_FACT="Release mais recente no GitHub: ${LATEST}."
          else
            LATEST_FACT="Nao foi possivel ler qual e a Release mais recente no GitHub."
          fi

          {
            echo "## APK publicado"
            echo ""
            echo "- ${RESULT}"
            echo "- ${LATEST_FACT}"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- Link fixo (sempre o mais novo): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/couplesync.apk"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${ACTION}" != "nada" ]; then
            if [ "${LATEST_OK}" != "1" ]; then
              echo "::error::Release ${TAG} publicada, mas nao foi possivel ler qual e a mais recente. Confira em ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases."
              exit 1
            fi
            if [ "${LATEST}" != "${TAG}" ]; then
              echo "::error::Release ${TAG} publicada, mas a mais recente no GitHub e '${LATEST}'. O link fixo e o aviso de atualizacao nao apontam para ${TAG}."
              exit 1
            fi
          elif [ "${LATEST_OK}" != "1" ]; then
            echo "::warning::Nao foi possivel ler qual e a Release mais recente."
          elif [ "${LATEST}" != "${TAG}" ]; then
            echo "::warning::A Release ${TAG} ja estava publicada; a mais recente no GitHub e '${LATEST}'. Nada foi alterado."
          fi
