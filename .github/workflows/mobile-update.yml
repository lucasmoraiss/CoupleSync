name: Mobile — OTA Update

# Runs on manual dispatch only: an OTA update replaces the JavaScript of every
# installed app, so it is published deliberately, not on every push.
#
# Uses EAS Update (Over-the-Air) — 100% free, unlimited pushes.
# No native rebuild required; the installed APK fetches the new JS bundle
# on next launch automatically.
#
# Required secret: EXPO_TOKEN
#   expo.dev → Settings → Access Tokens → Create token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-update:
    name: EAS Update — OTA (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli@12

      - name: EAS Update — push OTA bundle to production branch
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Must be set here so Metro inlines the correct production URL when
          # bundling. eas.json build.preview.env only applies to `eas build`,
          # NOT to `eas update`. Without this, process.env.EXPO_PUBLIC_API_BASE_URL
          # is undefined and the app falls back to the emulator address (10.0.2.2:5000).
          # No hardcoded fallback: the job fails if the secret is not configured.
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "${EXPO_PUBLIC_API_BASE_URL}" ]; then
            echo "::error::Secret EXPO_PUBLIC_API_BASE_URL is not set."
            exit 1
          fi
          eas update \
            --platform android \
            --branch production \
            --message "ci: ${{ github.sha }}" \
            --non-interactive
