name: Mobile — OTA Update

# Triggered after Deploy succeeds on main, ensuring the backend is live
# before the mobile bundle is pushed. Also supports manual dispatch.
#
# Uses EAS Update (Over-the-Air) — 100% free, unlimited pushes.
# No native rebuild required; the installed APK fetches the new JS bundle
# on next launch automatically.
#
# Required secret: EXPO_TOKEN
#   expo.dev → Settings → Access Tokens → Create token

on:
  workflow_run:
    workflows: ["Deploy"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-update:
    name: EAS Update — OTA (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli@12

      - name: EAS Update — push OTA bundle to production branch
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Must be set here so Metro inlines the correct production URL when
          # bundling. eas.json build.preview.env only applies to `eas build`,
          # NOT to `eas update`. Without this, process.env.EXPO_PUBLIC_API_BASE_URL
          # is undefined and the app falls back to the emulator address (10.0.2.2:5000).
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || 'https://couplesyncapi.azurewebsites.net' }}
        run: |
          eas update \
            --platform android \
            --branch production \
            --message "ci: ${{ github.sha }}" \
            --non-interactive
